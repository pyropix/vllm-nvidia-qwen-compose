#
# docker-compose for vLLM inference service.
#
x-defaults: &defaults
  image: vllm/vllm-openai:latest-aarch64
  restart: unless-stopped
  network_mode: host
  volumes:
    - ~/.cache/huggingface:/root/.cache/huggingface
    - ~/.cache/vllm:/root/.cache/vllm
    - ./fix-qwen3.6-chat-template/chat_template.jinja:/root/chat_template.jinja:ro

  env_file:
    - .env.vllm
  environment:
    CUTE_DSL_ARCH: sm_121a
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  vllm-nv-qwen3.6-27B-NVFP4:
    profiles: [vllm-nv-qwen3.6-27B-NVFP4]
    container_name: vllm-nv-qwen3.6-27B-NVFP4
    <<: *defaults
    command: >
      ${MODEL_ID}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size "1"
      --trust-remote-code
      --moe-backend marlin
      --kv-cache-dtype auto
      --gpu-memory-utilization "0.4"
      --max-model-len "262144"
      --max-num-batched-tokens "8192"
      --max-num-seqs "3"
      --enable-chunked-prefill
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      --load-format fastsafetensors
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --no-language-model-only
      --override-generation-config '{"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
      --default-chat-template-kwargs '{"enable_thinking": false, "enable_tool_call": true, "enable_tool_call_streaming": true}'
      --chat-template /root/chat_template.jinja

  vllm-nv-qwen3.6-35B-A3B-NVFP4:
    profiles: [vllm-nv-qwen3.6-35B-A3B-NVFP4]
    container_name: vllm-nv-qwen3.6-35B-A3B-NVFP4
    <<: *defaults
    command: >
      ${MODEL_ID}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size "1"
      --trust-remote-code
      --kv-cache-dtype fp8
      --attention-backend flashinfer
      --moe-backend marlin
      --gpu-memory-utilization "0.4"
      --max-model-len "262144"
      --max-num-seqs "4"
      --max-num-batched-tokens "8192"
      --enable-chunked-prefill
      --enable-prefix-caching
      --async-scheduling
      --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      --load-format fastsafetensors
      --reasoning-parser qwen3
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      --no-language-model-only
      --override-generation-config '{"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
      --default-chat-template-kwargs '{"enable_thinking": false, "enable_tool_call": true, "enable_tool_call_streaming": true}'
      --chat-template /root/chat_template.jinja

  vllm-nv-qwen3.8-27B-NVFP4:
    profiles: [vllm-nv-qwen3.8-27B-NVFP4]
    container_name: vllm-nv-qwen3.8-27B-NVFP4
    <<: *defaults
    environment:
      CUTE_DSL_ARCH: sm_121a
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    command: >
      ${MODEL_ID}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size "1"
      --trust-remote-code
      --gpu-memory-utilization "0.70"
      --max-model-len "1048576"
      --max-num-seqs "6"
      --max-num-batched-tokens "16384"
      --enable-chunked-prefill
      --enable-prefix-caching
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --speculative-config '{"method":"dspark","model":"Doopeworld/Qwen3.8-27B-DSpark-vLLM","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
      --hf-overrides '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'

  prometheus:
    image: prom/prometheus:latest
    container_name: vllm-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: vllm-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
