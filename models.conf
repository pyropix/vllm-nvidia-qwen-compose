# Available MODEL_ID values for `./vllm-serve.sh select`.
# One model per line. Blank lines and lines starting with # are ignored.
# get_service() derives the docker-compose service/profile name from each
# MODEL_ID by mapping the HF org to a tag (nvidia -> nv, unsloth -> us),
# stripping the org, lowercasing the leading character and prefixing with
# 'vllm-<tag>-'. The resulting name must match a service in
# docker-compose.yml, e.g.:
#   nvidia/Qwen3.6-27B-NVFP4  -> vllm-nv-qwen3.6-27B-NVFP4
#   unsloth/Qwen3.8-27B-NVFP4 -> vllm-us-qwen3.8-27B-NVFP4
nvidia/Qwen3.6-27B-NVFP4
nvidia/Qwen3.6-35B-A3B-NVFP4
nvidia/Qwen3.8-27B-NVFP4
unsloth/Qwen3.8-27B-NVFP4
